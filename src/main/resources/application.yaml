server:
  port: 8080

spring:
  application:
    name: CommunityManageSystem
  config:
    import: optional:classpath:env.yaml
  ai:
    deepseek:
      base-url: ${spring.ai.deepseek.base-url:}
      api-key: ${spring.ai.deepseek.api-key:}
      chat:
        options:
          model: ${spring.ai.deepseek.chat.options.model:deepseek-chat}
  datasource:
    url: ${datasource.url}
    username: ${datasource.username}
    password: ${datasource.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: edu.tut.cms.pojo.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${jwt.secret}
  expiration: ${jwt.expiration}

logging:
  level:
    edu.tut.cms: debug

cms:
  agent:
    page-size: 5
    max-history-messages: 8
